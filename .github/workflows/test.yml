name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Unit and relay tests (fake agents, no network)
        # Deprecation warnings fail the run, so APIs a future Python will remove show up early.
        run: python -W error::DeprecationWarning -W error::ResourceWarning -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m tagteam --version
          python -m tagteam init -C smoke --solo
          python -m tagteam status -C smoke
